        $(function () {

            $('#openPermission').click(function (event) {

                event.preventDefault();

                layer.load(3,

                    {

                        shade: [0.1, '#fff']

                    });

                $.post('/Web/Exam/OpenPermission',

                    {},

                    function (res) {

                        layer.closeAll('loading');

                        if (res.Success === 1) {

                            layer.alert(res.Msg, { icon: 6 });

                        } else if (res.Success === -1) {

                            layer.alert(res.Msg, { icon: 5 });

                        } else {

                            layer.alert(res.Msg, { icon: 5 });

                        }

                    });

            });

        });
