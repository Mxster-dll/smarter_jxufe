    <script>
        $(function () {
            $('#loadingbg').hide();
            if ($('#isOpenguide').length > 0) {
                var chapterNewGuide = getCookie('chapter-new-guide');
                if (chapterNewGuide == '' || chapterNewGuide == '0') {
                    introJs().setOptions({
                        prevLabel: "上一步",
                        nextLabel: "下一步",
                        skipLabel: "跳过",
                        doneLabel: "结束",
                        keyboardNavigation: true,
                        exitOnEsc: true
                    }).oncomplete(function () {
                        setCookie('chapter-new-guide', 1, 1);
                    }).onexit(function () {
                        setCookie('chapter-new-guide', 1, 1);
                    }).start();
                }
            }

        });
        function exam(isVisitAll, nChapterId, examinations) {
            if (isVisitAll == "false") {
                layer.open({
                    time: 2000,
                    icon: 7,
                    content: '同学，你还有线索没有发现^_^',
                    anim: 6,
                    title: false,
                    btn: false,
                    success: function (layero, index) {
                        $('.cover').removeClass('hidden');
                        //增加高亮样式及动画
                        $('.chapter').each(function () {
                            if (!$(this).hasClass('grayscale')) {
                                $(this).addClass('highlight animated shake');
                                if ($(this).parents('li').length > 0) {
                                    $(this).parents('li').addClass('highlight animated shake');
                                } else {
                                    $(this).addClass('highlight animated shake');
                                }

                            }
                        });

                    }
                });
                return;
            }
            if (examinations == 1 || examinations == 4) {
                if (isVisitAll == "true") {
                    window.location.href = '/Web/Exam?cid=7f6d456b-2372-4b80-8e5a-0f6bf8c979c4';
                }
            } else if (examinations == 2) {
                if (isVisitAll == "true") {
                    var idArr = nChapterId.split(',');
                    if (idArr[1]) {
                        window.location.href = '/web/Chapter/Index?id=' + idArr[1] + "&tid=" + $('#themeId').val();
                    } else {
                        window.location.href = '/web/Exam/Index?cid=' + idArr[0];
                    }
                }
            }
        }
    </script>
