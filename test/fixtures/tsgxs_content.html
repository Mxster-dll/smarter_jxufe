    <script>

        var time;

        var oldleft = $('.jsleft').find('a').attr('href');

        var oldright = $('.jsright').find('a').attr('href');

        var jumpnext = 1;

        function smsTime(o) {

            if (time > 0) {

                var minute = Math.floor((time / 60) % 60);

                var second = Math.floor(time % 60);

                o.innerHTML = (minute < 10 ? "0" + minute : minute) + ":" + (second < 10 ? "0" + second : second);

                time--;

                jumpnext = 0;

                $('.jsleft').find('a').attr('href', '#');

                $('.jsright').find('a').attr('href', '#');

                setTimeout(function () {

                    smsTime(o);

                },

                    1000);



            } else {

                jumpnext = 1;

                o.innerHTML = "00:00";

                $('.jsleft').find('a').attr('href', oldleft);

                $('.jsright').find('a').attr('href', oldright);



            }

        }

        $(function () {

            time = $('#djs').val();

            if (time > 0 && $('#isuser').length > 0) {

                smsTime(document.getElementById('daojishi'));

            }

            $('.back a').click(function (e) {

                if (jumpnext == 0) {

                    e.preventDefault();

                    layui.use('layer',

                        function () {

                            var layer = layui.layer;

                            layer.msg('请倒计时结束后再点击');



                        });

                }

            });

            //png图片 移除背景loading

            $('.tupian img,.wenzi img,.m-left img,.m-right img,.m-content img').each(function () {

                var img = new Image();

                img.src = $(this).attr('src') || $(this).attr('lay-src');

                if (img.complete) {

                    $(this).css('background', 'none');

                    return;

                }

                var that = $(this);

                img.onload = function () {

                    img.onload = null;

                    $(that).css('background', 'none');

                };



            });

            var audioinput = $('#audio');

            var myaudio = document.getElementById('audid');

            if ($('#video').length > 0) {

                videojs('video',

                    {

                        autoplay: false

                    }).ready(function () {

                        this.hotkeys({

                            volumeStep: 0.1,

                            seekStep: 5,

                            enableModifiersForNumbers: false

                        });



                    });

                var player = videojs('video',

                    {},

                    function () {



                    });

                player.on('play',

                    function () {

                        if ($('#audid').length > 0) {



                            myaudio.pause();

                        }

                    });

                player.on('pause',

                    function () {

                        if ($('#audid').length > 0) {

                            myaudio.play();

                        }

                    });

                player.on('ended',

                    function () {

                        if ($('#audid').length > 0) {

                            myaudio.play();

                        }

                    });

            }

            if ($('.tupian').length > 0) {

                var viewerTupian = new Viewer($('.tupian')[0],

                    {

                        title: false,

                        navbar: false

                    });

            }

            if ($('.wenzi').length > 0) {

                var viewerWenzi = new Viewer($('.wenzi')[0],

                    {

                        title: false,

                        navbar: false

                    });

            }

            if ($('.middle').length > 0) {

                var viewermiddle = new Viewer($('.middle')[0],

                    {

                        title: false,

                        navbar: false

                    });

            }

            layui.use('carousel',

                function () {

                    var carousel = layui.carousel;

                    carousel.render({

                        elem: '#pggroup',

                        width: '100%',

                        height: '100%',

                        interval: 5000,

                        autoplay: true,

                        arrow: 'hover'

                    });

                });

            $('.last a').each(function (i, v) {

                var href = $(v).attr('href');

                $(v).attr('href', '#;' + href);

            });

            $('.first a').each(function (i, v) {

                var href = $(v).attr('href');

                $(v).attr('href', '#;' + href);

            });





            $('.last').click(function () {

                if (jumpnext == 1) {

                    layui.use('layer',

                        function () {

                            var layer = layui.layer;

                            layer.msg('当前已经是最后一节,将跳转到当前章的第一节');



                        });

                    setTimeout(function () {

                        var oldhref = $('.last').find('a').attr('href');

                        location.href = oldhref.substring(2);



                    },

                        2000);

                } else if (jumpnext == 0) {

                    layui.use('layer',

                        function () {

                            var layer = layui.layer;

                            layer.msg('请倒计时结束后再点击');



                        });

                }



            });

            $('.first').click(function () {

                if (jumpnext == 1) {

                    layui.use('layer',

                        function () {

                            var layer = layui.layer;

                            layer.msg('当前已经是第一节,将跳转到当前章的最后一节');



                        });

                    setTimeout(function () {

                        var oldhref = $('.first').find('a').attr('href');

                        location.href = oldhref.substring(2);



                    },

                        2000);

                } else if (jumpnext == 0) {

                    layui.use('layer',

                        function () {

                            var layer = layui.layer;

                            layer.msg('请倒计时结束后再点击');



                        });

                }



            });



            $('.jsleft').click(function () {

                if (jumpnext == 0) {

                    layui.use('layer',

                        function () {

                            layer.msg('请倒计时结束后再点击');

            $('.jsright').click(function () {

                        function () {

                            var layer = layui.layer;

                            layer.msg('请倒计时结束后再点击');



                        });

                }



            });





        });
