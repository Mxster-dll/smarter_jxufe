    <script>

        var timer = null;
        //开始计时 函数
        window.startTimer = function () {
            var secondcount = 0;
            timer = setInterval(function () {
                secondcount += 1;
                var minute = Math.floor((secondcount / 60) % 60);
                var second = Math.floor(secondcount % 60);
                $('#minute').text(minute < 10 ? "0" + minute : minute); //分钟
                $('#second').text(second < 10 ? "0" + second : second); //秒
            },
                1000);
        }

        //停止计时 函数
        window.stopTimer = function () {
            clearInterval(timer);
            timer = null;
        }
        //计时  开始
        startTimer();
        $(function () {
            $('.djdiv  .box li').hover(function () {
                $(this).addClass('animated pulse');
            }, function () {
                $(this).removeClass('animated pulse');
            });
        });
    </script>
