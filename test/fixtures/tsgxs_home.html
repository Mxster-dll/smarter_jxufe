    <script>
        var wait = 60;
        var stutype = 0, uid = '';

        function smsTime(o) {
            if (wait == 0) {
                o.removeAttribute("disabled");
                o.innerHTML = "重新获取验证码";
                wait = 60;
            } else {
                o.setAttribute("disabled", true);
                o.innerHTML = wait + "s后再发送";
                wait--;
                setTimeout(function () {
                    smsTime(o);
                },
                    1000);
            }
        }

        function login(data) {
            $.post('/Web/User/Login',
                data,
                function (res) {
                    $('#btnLogin').removeClass('submitting');
                    $('#btnLogin').html('登录').css('cursor', 'pointer').on('click', btnLogin);
                    if (res.Success === 1 || res.Success === 2) {
                        $('.login_kuang').hide();
                        $('#themeBox').hide();
                        $('.cover').hide();
                        window.location.reload();

                    } else if (res.Success === -2) {
                        uid = res.Uid;
                        if ($('#tid').length > 0) {
                            theme({
                                uid: res.Uid,
                                tid: $('#tid').val()
                            });
                        } else {
                            $('.login_kuang').hide();
                            $('#themeBox').show();
                        }
                    } else if (res.Success === 3) {
                        $('.login_kuang').hide();
                        layer.confirm('系统已开启多次考试，是否需要重新考试？最终将以最高分作为标准。',
                            {
                                icon: 0,
                                title: '提示',
                                btn: ['是', '否'],
                                cancel: function (index) {
                                    layer.close(index);
                                    $.post('/Web/User/RLogin', { uid: res.Uid }, function (res) {
                                        window.location.reload();
                                    });

                                }
                            },
                            function (index) {
                                layer.close(index);
                                uid = res.Uid;
                                if ($('#tid').length > 0) {
                                    theme({
                                        uid: res.Uid,
                                        tid: $('#tid').val()
                                    });
                                } else {
                                    $('.login_kuang').hide();
                                    $('#themeBox').show();
                                }
                            }, function (index) {
                                layer.close(index);
                                $.post('/Web/User/RLogin', { uid: res.Uid }, function (res) {
                                    window.location.reload();
                                });
                            }
                        );
                    } 
                    else {
                        $('#pVCode').val('');
                        $('#vcodeimg').click();
                        var msg = "服务器错误";
                        if (res.Msg) {
                            msg = res.Msg;
                        }
                        layer.msg(msg, function () { });
                    }
                });
        }

        function theme(data) {
            $.post('/Web/User/SelectTheme',
                data,
                function (res) {
                    $('#btnTheme').removeClass('submitting');
                    $('#btnTheme').html('提交').css('cursor', 'pointer').off('click', btnTheme);
                    if (res.Success === 1) {
                        $('.login_kuang').hide();
                        $('#themeBox').hide();
                        $('.cover').hide();
                        window.location.href = '/web/user/Index';

                    } else {
                        var msg = "服务器错误";
                        if (res.Msg) {
                            msg = res.Msg;
                        }
                        layer.msg(msg, function () { });
                    }
                });
        }

        function btnLogin() {
            $('#login').validate({
                onfocusout: false,
                onkeyup: false,
                rules: {
                    userid: 'required',
                    pwd: 'required'
                },
                messages: {
                    userid: '账号不能为空',
                    pwd: '密码不能为空'
                },
                errorPlacement: function (error, element) {
                    layer.msg($(error).text(), function () { });
                }
            });
            if ($('#login').valid()) {
                if ($('input[name="stutype"]').length > 0) {
                    //开启了研究生功能
                    if (!$('input[name="stutype"]:checked').val()) {
                        layer.msg("请选择学生类型", function () { });
                        return;
                    }
                    stutype = $('input[name="stutype"]:checked').val();
                }
                var data = {
                    userid: $('#userid').val(),
                    pwd: $("#pwd").val(),
                    vcode: $("#pVCode").val(),
                    stutype: stutype
                }
                $('#btnLogin').addClass('submitting');
                $('#btnLogin').html('登录中...').css('cursor', 'default').off('click');
                login(data);
            }
        }

        function btnTheme() {
            if (!$("input[name='tid']:checked").val()) {
                layer.msg("请选择版式", function () { });
                return;
            }

            var data = {
                uid: uid,
                tid: $("input[name='tid']:checked").val()
            }
            $('#btnTheme').addClass('submitting');
            $('#btnTheme').html('提交中...').css('cursor', 'default').off('click');
            theme(data);
        }
        function showPwd() {
            var eye = document.getElementById('eye');
            var password = document.getElementById('pwd');
            var span = document.getElementById('span');
                if (password.type == "password") {
                    password.type = "text";
                    span.innerHTML = '&#xe68c';

                } else {
                    password.type = "password";
                    span.innerHTML = '&#xe60c;';
                }

        }


        $(function () {
            window.onload = function () {
                $('#loadingbg').hide();
                if ($('#isOpenguide').length>0) {
                    if ($('#jump').length > 0 && $('#isuser').length > 0) {
                        $('#loadingbg').hide();
                        var indexNewGuide = getCookie('index-new-guide');
                        if (indexNewGuide == '' || indexNewGuide == '0') {
                            introJs().setOptions({
                                prevLabel: "上一步",
                                nextLabel: "下一步",
                                skipLabel: "跳过",
                                doneLabel: "结束",
                                keyboardNavigation: true,
                                exitOnEsc: true
                            }).oncomplete(function () {
                                setCookie('index-new-guide', 1, 1);
                            }).onexit(function () {
                                setCookie('index-new-guide', 1, 1);
                            }).start();
                        }
                    } else if ($('#nomal').length > 0) {
                        $('#loadingbg').hide();
                        var indexNewGuide = getCookie('index-new-guide');
                        if (indexNewGuide == '' || indexNewGuide == '0') {
                            introJs().setOptions({
                                prevLabel: "上一步",
                                nextLabel: "下一步",
                                skipLabel: "跳过",
                                doneLabel: "结束",
                                keyboardNavigation: true,
                                exitOnEsc: true
                            }).oncomplete(function () {
                                setCookie('index-new-guide', 1, 1);
                            }).onexit(function () {
                                setCookie('index-new-guide', 1, 1);
                            }).start();
                        }
                    }
                }
                
            }
           
            $('.noLogin').click(function (event) {
                event.preventDefault();
                $('#nologin').click();
            });
            $('.noPass').parent('a').click(function (event) {
                event.preventDefault();
                layer.msg("请按照顺序依次点击闯关", function () { });
            });
            //单选
            $('.radio').click(function () {
                $(this).find('input').prop('checked', true);
            });
            //版本弹框单选
            $('.versionli').click(function () {
                $(this).find('input').prop('checked', true);
            });
            //声音切换
            $("#soundOn").click(function () {
                //关
                $(this).hide();
                $("#soundOff").show();
                setCookie('audio', 0, 10);
                if (!$.support.leadingWhitespace) {
                    var embed = document.getElementsByTagName("embed");
                    if (embed != null && embed.length > 0) {
                        embed[0].pause();
                    }
                } else {
                    var audio = document.getElementsByTagName("audio");
                    if (audio != null && audio.length > 0) {
                        audio[0].pause();
                    }
                }
            });
            $("#soundOff").click(function () {
                //开
                $(this).hide();
                $("#soundOn").show();
                setCookie('audio', 1, 10);
                var url = $('#audio').val();
                if (url != null && url.length > 0) {
                    if (!$.support.leadingWhitespace) {
                        var embed = document.getElementsByTagName("embed");
                        if (embed != null && embed.length > 0) {
                            embed[0].autostart = "1";
                        } else {
                            var em = document.createElement("embed");
                            em.autostart = "1";
                            em.src = url;
                            em.setAttribute("hidden", "true");
                            em.setAttribute("loop", "true");
                            document.body.appendChild(em);
                        }
                    } else {
                        var audio = document.getElementsByTagName("audio");
                        if (audio != null && audio.length > 0) {
                            audio[0].play();
                        } else {
                            audio = document.createElement("audio");
                            audio.src = url;
                            audio.addEventListener('ended',
                                function () {
                                    setTimeout(function () {
                                        audio.play();
                                    },
                                        500);
                                },
                                false);
                            audio.play();
                            var first = document.body.firstChild; //得到页面的第一个元素
                            document.body.insertBefore(audio, first); //在得到的第一个元素之前插入
                        }
                    }
                }
            });
            var audioOpen = getCookie('audio');
            if (audioOpen == '' || audioOpen == '1') {
                $("#soundOff").hide();
                $("#soundOn").show();
                var url = $('#audio').val();
                if (url != null && url.length > 0) {
                    if (!$.support.leadingWhitespace) {
                        var em = document.createElement("embed");
                        em.autostart = "1";
                        em.src = url;
                        em.setAttribute("hidden", "true");
                        em.setAttribute("loop", "true");
                        document.body.appendChild(em);
                    } else {
                        var audio = document.createElement("audio");
                        audio.src = url;
                        audio.addEventListener('ended',
                            function () {
                                setTimeout(function () {
                                    audio.play();
                                },
                                    500);
                            },
                            false);
                        audio.play();
                        var first = document.body.firstChild; //得到页面的第一个元素
                        document.body.insertBefore(audio, first); //在得到的第一个元素之前插入
                    }
                }
            } else {
                $("#soundOff").show();
                $("#soundOn").hide();
            }
            //登录部分
            $('#nologin').click(function (event) {
                event.preventDefault();
                if ($('#redirectUrl').val()) {
                    window.location.href = $('#redirectUrl').val();
                } else {
                    $('.login_kuang').show();
                    $('.cover').show();
                }
            });

            $('#btnLogin').click(function () {
                btnLogin();
            });

            $('#eye').click(function() {
                showPwd();
            });
            //选择版本弹出框关闭
            $('.xzbb-close').click(function () {
                $('#themeBox').hide();
                $('.login_kuang').show();
            });
            //登录框关闭
            $('.login-close').click(function () {
                $('.login_kuang').hide();
                $('.cover').hide();
            });

            $('#btnTheme').click(function () {
                btnTheme();
            });
            $('.login_kuang').keydown(function (event) {
                if (event.keyCode == 13) {
                    $('#btnLogin').click();
                };
            });
            //忘记密码
            $('#vcodeimg').click(function () {
                $("#vcodeimg")[0].src = $("#vcodeimg")[0].src.split("?")[0] + "?t=" + parseFloat(new Date().getTime());
            });
            $('#getSmsCode').click(function () {
                if (!$('#phone').val()) {
                    layer.msg('手机号不能为空', function () { });
                    return;
                }
                if (!$('#pVCodePwd').val()) {
                    layer.msg('图片验证码不能为空', function () { });
                    return;
                }
                if (!new RegExp("^[1][0-9]{10}$").test($('#phone').val())) {
                    layer.msg('手机号格式不正确', function () { });
                    return;
                }
                $.post('/Web/User/FindPassGetSms', {
                    phone: $('#phone').val(),
                    vcode: $("#pVCodePwd").val()
                },
                    function (res) {
                        layer.closeAll('loading');
                        if (res.Success == 1) {
                            //进入下一步
                            smsTime(document.getElementById('getSmsCode'));
                        } else if (res.Success == -1) {
                            layer.msg(res.Msg, function () { });
                            $('#vcodeimg').click();
                        } else {
                            if (!res.Msg) {
                                res.Msg = "服务器错误";
                            }
                            layer.msg(res.Msg, function () { });
                        }
                    });
                

            });
            $('#btnPhone').click(function () {
                if (!$('#phone').val()) {
                    layer.msg('手机号不能为空', function () { });
                    return;
                }
                if (!$('#pVCodePwd').val()) {
                    layer.msg('图片验证码不能为空', function () { });
                    return;
                }
                if (!$('#smsCode').val()) {
                    layer.msg('短信验证码不能为空', function () { });
                    return;
                }
                if (!new RegExp("^[1][0-9]{10}").test($('#phone').val())) {
                    layer.msg('手机号格式不正确', function () { });
                    return;
                }
                $.post('/Web/User/IsLegalPhone',
                    {
                        phone: $('#phone').val(),
                        vcode: $("#pVCodePwd").val(),
                        smscode: $("#smsCode").val()
                    },
                    function (res) {
                        layer.closeAll('loading');
                        if (res.Success == 1) {
                            //进入下一步
                            $(".pop_up6").hide();
                            $(".pop_up7").show();
                            $('.logincontent').addClass('hidden');
                            $('.findpwd').addClass('hidden');
                            $('.resetpwd').removeClass('hidden');
                        } else if (res.Success == -1) {
                            layer.msg(res.Msg, function () { });
                            $('#vcodeimg').click();
                        } else {
                            if (!res.Msg) {
                                res.Msg = "服务器错误";
                            }
                            layer.msg(res.Msg, function () { });
                        }
                    });
            });
            $('#btnResetPwd').click(function () {
                if (!$('#newpwd').val()) {
                    layer.msg('密码不能为空', function () { });
                    return;
                }
                if (!$('#newpwd2').val()) {
                    layer.msg('确认密码不能为空', function () { });
                    return;
                }
                if ($('#newpwd').val() != $('#newpwd2').val()) {
                    layer.msg('2次输入密码不一致', function () { });
                    return;
                }
                $.post('/Web/User/ResetPwd',
                    {
                        newpwd: $('#newpwd').val(),
                        newpwd2: $("#newpwd2").val()
                    },
                    function (res) {
                        layer.closeAll('loading');
                        if (res.Success == 1) {
                            //进入下一步
                            layer.msg(res.Msg);
                            $(".pop_up7").hide();
                            $(".hui").show();
                            $(".pop_up2").show();
                            $('.logincontent').removeClass('hidden');
			    	        $('.findpwd').addClass('hidden');
			    	        $('.resetpwd').addClass('hidden');
                        } else {
                            if (!res.Msg) {
                                res.Msg = "服务器错误";
                            }
                            layer.msg(res.Msg, function () { });
                        }
                    });
            });
            $('#cancel').click(function () {
                $('.logincontent').removeClass('hidden');
                $('.findpwd').addClass('hidden');
                $('.resetpwd').addClass('hidden');
            });
            $('#rcancel').click(function () {
                $('.resetpwd').addClass('hidden');
                $('.findpwd').removeClass('hidden');
            });

        });
    </script>

</head>
