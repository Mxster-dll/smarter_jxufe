<div class="content-mini bg-gray-lighter adminHeadBox hidden-xs">

        <div class="col-sm-5 text-right hidden-xs">

            </ol>

<div class="block">

    <div class="block-content table-responsive">

        <form id="inputForm" class="form-horizontal" action="update.html" method="post">

            <input type="hidden" name="id" id="id" value="206001"/>

            <input type="hidden" name="team" id="team" value="个人"/>

            <div class="form-group">

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">申请人姓名</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="肖雅"/>

                </div>

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">学号</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="0252633"/>

                </div>

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">行政班级</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="25人工智能1班"/>

                </div>

            </div>

            <div class="form-group">

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">比赛名称</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="全国大学生职业规划大赛"/>

                </div>

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">比赛时间</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="2025"/>

                </div>

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">比赛网址</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value=""/>

                </div>

            </div>

            <div class="form-group">

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">学生提交的奖项</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="【校赛】参与未获奖"/>

                </div>

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">最终获得奖项</label>

                    <select class="form-control" id="credit_id" name="credit_id" disabled>

                        <option  value="" >无</option>

                            <option  value="41297" >特等奖(2)分</option>

                            <option  value="41298" >一等奖(1.5)分</option>

                            <option  value="41299" >二等奖(1)分</option>

                            <option  value="41300" >三等奖(0.5)分</option>

                            <option  value="41301" >参与未获奖(0.1)分</option>

                    </select>

                </div>

                <div class="col-xs-4 col-md-4">

                    <label for="name" style="margin-bottom:10px;">个人得分</label>

                    <input class="form-control" type="text" readonly="readonly"

                           value="0分"/>

                </div>

            </div>

            <div class="form-group">

                <div class="col-xs-12 col-md-12">

                    <label for="name" style="margin-bottom:10px;">意见</label>

                    <textarea class="form-control" rows="5" readonly="readonly"

                              ></textarea>

                </div>

            </div>

        </form>

    </div>
