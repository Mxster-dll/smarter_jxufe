    <script type="text/javascript">
        var webauthnServerPrefix = "https:\/\/authx-service.jxufe.edu.cn\/fido2";

        (async () => {
            // import * as webauthnJson from "\/cas\/webauthn\/lib\/webauthn-json-0.6.1\/dist\/esm\/webauthn-json.js";
            const webauthnJson = await import(webauthnServerPrefix + '/webauthn/lib/webauthn-json-0.6.1/dist/esm/webauthn-json.js');
            console.log("webauthnJson", webauthnJson)
            console.log("supported", webauthnJson.supported())

            window.webauthnJson = webauthnJson;

            var isConditionalMediationAvailable = await PublicKeyCredential.isConditionalMediationAvailable();
            var isUserVerifyingPlatformAuthenticatorAvailable = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();

            var isPasskeySupport = isConditionalMediationAvailable && isUserVerifyingPlatformAuthenticatorAvailable;
            console.log("isPasskeySupport", isPasskeySupport);
            window.isPasskeySupport = isPasskeySupport;
        })();

        function rejectIfNotSuccess(response) {
            if (response.success) {
                return response;
            } else {
                return new Promise((resolve, reject) => reject(response));
            }
        }

        function rejected(err) {
            return new Promise((resolve, reject) => reject(err));
        }

        function setStatus(statusText) {
            //document.getElementById('status').textContent = statusText;
            console.log("status", statusText);
        }

        function extend(obj, more) {
            return Object.assign({}, obj, more);
        }

        function showJson(name, data) {
            // const el = document.getElementById(name).textContent = JSON.stringify(data, false, 2);
            console.log(JSON.stringify(data, false, 2));
        }

        function showRequest(data) {
            return showJson('request', data);
        }
        function showAuthenticatorResponse(data) {
            const clientDataJson = data && (data.response && data.response.clientDataJSON);
            return showJson('authenticator-response', extend(
                data, {
                _clientDataJson: data && JSON.parse(new TextDecoder('utf-8').decode(base64url.toByteArray(clientDataJson))),
            }));
        }
        function showServerResponse(data) {
            if (data && data.messages) {
                // addMessages(data.messages);
            }
            return showJson('server-response', data);
        }

        function getIndexActions() {
            /*
            return fetch('api/v1/')
              .then(response => response.json())
              .then(data => data.actions)
            ;
          qrcode : "\/cas\/themes\/mf\/images\/qrcode.svg",
            */

            let actions = {
                //          register: webauthnServerPrefix+'/webauthn/register',
                authenticate: webauthnServerPrefix + '/webauthn/authenticate'
            };
            return new Promise((resolve, reject) => resolve(actions)).then(data => {
                return data;
            });

        }

        async function submitResponse(url, request, response) {
            console.log('submitResponse', url, request, response);

            const body = {
                requestId: request.requestId,
                credential: response,
                sessionToken: request.sessionToken || session.sessionToken || null,
            };

            /* return fetch(url, {
              method: 'POST',
              body: JSON.stringify(body),
            })
              .then(response => response.json())
              .then(updateSession)
            ; */
            const res = await fetch(url, {
                method: 'POST',
                body: JSON.stringify(body),
            });
            if (!res.ok) {
                console.log("res", res);
                return { "success": false };
            }

            const data = await res.json();

            return updateSession(data);
        }

        let ceremonyState = {};

        async function performCeremony(params) {
            const callbacks = params.callbacks || {}; /* { init, authenticatorRequest, serverRequest } */
            const getIndexActions = params.getIndexActions; /* function(): object */
            const getRequest = params.getRequest; /* function(urls: object): { publicKeyCredentialCreationOptions: object } | { publicKeyCredentialRequestOptions: object } */
            const statusStrings = params.statusStrings; /* { init, authenticatorRequest, serverRequest, success, } */
            const executeRequest = params.executeRequest; /* function({ publicKeyCredentialCreationOptions: object } | { publicKeyCredentialRequestOptions: object }): Promise[PublicKeyCredential] */
            const handleError = params.handleError; /* function(err): ? */

            //setStatus('Looking up API paths...');
            //resetDisplays();

            const rootUrls = await getIndexActions();

            //setStatus(statusStrings.int);
            if (callbacks.init) {
                callbacks.init(rootUrls);
            }
            const { request, actions: urls } = await getRequest(rootUrls);

            //setStatus(statusStrings.authenticatorRequest);
            if (callbacks.authenticatorRequest) {
                callbacks.authenticatorRequest({ request, urls });
            }
            // showRequest(request);
            ceremonyState = {
                callbacks,
                request,
                statusStrings,
                urls,
            };

            const webauthnResponse = await executeRequest(request);
            const serverResponse = await finishCeremony(webauthnResponse);

            return serverResponse;
        }

        async function finishCeremony(response) {
            const callbacks = ceremonyState.callbacks;
            const request = ceremonyState.request;
            const statusStrings = ceremonyState.statusStrings;
            const urls = ceremonyState.urls;

            //setStatus(statusStrings.serverRequest || 'Sending response to server...');
            if (callbacks.serverRequest) {
                callbacks.serverRequest({ urls, request, response });
            }
            // showAuthenticatorResponse(response);

            const data = await submitResponse(webauthnServerPrefix + "/" + urls.finish, request, response);

            /* if (data && data.success) {
              setStatus(statusStrings.success);
            } else {
              setStatus('Error!');
            } */
            // showServerResponse(data);

            return data;
        }



        let session = {};

        function updateSession(response) {
            if (response.sessionToken) {
                session.sessionToken = response.sessionToken;
            }
            if (response.username) {
                session.username = response.username;
            }
            // updateSessionBox();
            // updateRegisterButtons();
            return response;
        }

        function getAuthenticateRequest(urls, username) {
            console.log('getAuthenticateRequest', urls, username);

            return fetch(urls.authenticate, {
                body: new URLSearchParams(username ? { username } : {}),
                method: 'POST',
            })
                .then(response => response.json())
                .then(updateSession)
                .then(rejectIfNotSuccess)
                ;
        }

        function executeAuthenticateRequest(request) {
            console.log('executeAuthenticateRequest', request);

            return webauthnJson.get({ publicKey: request.publicKeyCredentialRequestOptions });
        }

        // 发起登录请求，
        // 获取 username ， 向认证服务 发起 认证请求，调用 /webauthn/authenticate 接口（getAuthenticateRequest）
        // 获取 request ， 向设备（浏览器）获取 ，调用 webauthnJson.get（executeAuthenticateRequest）
        // 获取 webauthnResponse ， 向认证服务 进行认证， 调用 登录接口
        async function authenticate(username) {
            try {
                /* const rootUrls = await getIndexActions();
                const { request } = await getAuthenticateRequest(rootUrls, username);
                const webauthnResponse = await executeAuthenticateRequest(request);
          
                const body = {
                  requestId: request.requestId,
                  credential: webauthnResponse,
                  sessionToken: request.sessionToken || session.sessionToken || null,
                };
          
                return JSON.stringify(body);  // 返回 调用 登录接口 */

                const data = await performCeremony({
                    getIndexActions,
                    getRequest: urls => getAuthenticateRequest(urls, username),
                    statusStrings: {
                        init: 'Initiating authentication ceremony with server...',
                        authenticatorRequest: 'Asking authenticators to perform assertion...',
                        success: 'Authentication successful!',
                    },
                    executeRequest: executeAuthenticateRequest,
                });

                /* if (data.registrations) {
                  // addMessage(`Authenticated as: ${data.registrations[0].username}`);
                  console.log('Authenticated as:', data.registrations[0].username);
                } */
                return data;
            } catch (err) {
                // setStatus('Authentication failed.');
                /* if (err.name === 'InvalidStateError') {
                  addMessage(`This authenticator is not registered for the account "${username}". Please try again with a registered authenticator.`)
                } else if (err.message) {
                  addMessage(`${err.name}: ${err.message}`);
                } else if (err.messages) {
                  addMessages(err.messages);
                } */
                console.error('Authentication failed', err);
                return rejected(err);
            }
        }

    </script>

            <script type="text/javascript">
                // 登录失败，处理失败
                function processLoginError(containerFormInput, containerForm, originalUsername, hasErrors, errors, loginType) {
                    console.log(containerForm);
                    console.log(originalUsername);
                    console.log(hasErrors);
                    console.log(errors);

                    doLoginFailN(containerFormInput, containerForm, originalUsername, hasErrors, errors, loginType);
                }

                var casServerPasswordlessCaptchaEnabled = null;

                var casServerCaptchaEnabled = true;
                var casServerCaptchaSkipN = true;
                var captchaSkipN = "3";

                var casServerCaptchaShow = false;

                // 提交登录时，记录登录次数、登录时间
                function doLogin() {
                    var loginN = (localStorage.loginN || "0");
                    if (loginN == null) {
                        loginN = "0";
                    }

                    loginN = parseInt(loginN) + 1;
                    localStorage.loginN = loginN;

                    var nowTimestamp = new Date().getTime();
                    localStorage.loginNTimestamp = nowTimestamp;
                }

                //登录失败时，记录失败次数、失败时间，并显示 图片验证码
                function doLoginFailN(containerFormInput, containerForm, originalUsername, hasErrors, errors, loginType) {

                    var failN = (localStorage.failN || "0");
                    if (failN == null) {
                        failN = "0";
                    }

                    if (hasErrors) {
                        failN = parseInt(failN) + 1;
                        localStorage.failN = failN;

                        var nowTimestamp = new Date().getTime();
                        localStorage.failNTimestamp = nowTimestamp;
                    }

                    doErrorShow(containerForm, hasErrors, errors, loginType);
                    doCaptchaShow(containerFormInput, containerForm, failN, loginType);
                }

                function doErrorShow(containerForm, hasErrors, errors, loginType) {
                    if (!hasErrors) {
                        return;
                    }

                    // 显示错误信息
                    var error = errors[0];

                    if ("passwordLogin" == loginType) {
                        if (passwordLoginCom) {
                            passwordLoginCom.loginError = error;
                        }
                    } else if ("smsCodeLogin" == loginType) {
                        if (smsCodeLoginCom) {
                            smsCodeLoginCom.loginError = error;
                        }
                    }

                }

                // 显示 图片验证码
                function doCaptchaShow(containerFormInput, containerForm, failN, loginType) {
                    console.log('show captcha, failN=' + failN + ", captchaSkipN=" + captchaSkipN);

                    var fialNInput = containerForm.find('[name="failN"]');
                    fialNInput.val(failN);

                    /* var captchaInput = containerFormInput.find('[name="captcha"]');  // console.log(captchaInput.parents("div.el-form-item"));
                    if (captchaInput.length <= 0) {
                      return;
                    }
                    
                    captchaInput.parents("div.captcha-input-container").hide();
                  
                    if (failN < 0) {
                      captchaInput.parents("div.captcha-input-container").show();
                    } else if (failN >= captchaSkipN) {
                      captchaInput.parents("div.captcha-input-container").show();
                    } */

                    var isCaptchaShow = false;
                    if (failN < 0) {
                        isCaptchaShow = true;
                    } else if (failN >= captchaSkipN) {
                        isCaptchaShow = true;
                    }

                    if ("passwordLogin" == loginType) {
                        if (passwordLoginCom) {
                            passwordLoginCom.isCaptchaShow = isCaptchaShow;
                        }
                    } else if ("smsCodeLogin" == loginType) {
                        if (smsCodeLoginCom) {
                            smsCodeLoginCom.isCaptchaShow = isCaptchaShow;
                        }
                    }

                    var captchaInput = containerFormInput.find('[name="captcha"]');
                    if (captchaInput.length <= 0) {
                        return;
                    }

                    captchaInput.parents("div.captcha-input-container").hide();
                    casServerCaptchaShow = false;
                    if (isCaptchaShow) {
                        captchaInput.parents("div.captcha-input-container").show();
                        casServerCaptchaShow = true;
                    }
                }

                // 判断是否显示 图片验证码
                function initCaptchaShow(containerFormInput, containerForm, loginType) {
                    if (casServerCaptchaEnabled) {
                        if (casServerCaptchaSkipN) {
                            var loginN = (localStorage.loginN || "0");
                            if (loginN == null) {
                                loginN = "0";
                            }
                            loginN = parseInt(loginN);

                            var failN = (localStorage.failN || "0");
                            if (failN == null) {
                                failN = "0";
                            }
                            failN = parseInt(failN);

                            var failNTimestamp = (localStorage.failNTimestamp || "0");
                            if (failNTimestamp == null) {
                                failNTimestamp = "0";
                            }

                            var nowTimestamp = new Date().getTime();
                            console.log('init captcha, failNTimestamp=' + failNTimestamp + ", nowTimestamp=" + nowTimestamp);
                            if (failNTimestamp < (nowTimestamp - (1000 * 60 * 60 * 1))) { // FIXME: 如果 1小时后，再登录，则清空 failN
                                loginN = 0;
                                localStorage.loginN = loginN;
                                failN = 0;
                                localStorage.failN = failN;
                            }

                            if (failN < loginN) {
                                loginN = 0;
                                localStorage.loginN = loginN;
                                failN = 0;
                                localStorage.failN = failN;
                            }

                            doCaptchaShow(containerFormInput, containerForm, failN, loginType); // 显示
                        } else {
                            doCaptchaShow(containerFormInput, containerForm, -1, loginType); // 始终显示
                        }
                    }
                }
            </script>

                        initGuard: function initGuard() {
                            var self = this;

                            var type = this.typeInfo[this.typeIndex].type;
                            var state = $("#fm1").find('[name="mfaState"]').val();

                            var url = "\/cas\/mfa\/initByType" + "/" + type;
                            url += "?state=" + state;
                            $.ajax({
                                type: "GET",
                                url: url,
                                dataType: "json",
                                success: function success(r) {
                                    console.log(url, r);
                                    if (r && r.code == 0) {
                                        self.attestServerUrl = r.data.attestServerUrl;
                                        self.gid = r.data.gid;

                                        if (type == "apppush") {

                                        } else if (type == "securephone") {
                                            self.securePhone = r.data.securePhone;
                                        } else if (type == "secureemail") {
                                            self.secureEmail = r.data.secureEmail;
                                        } else if (type == "qrcode") {
                                            self.qrCode = r.data.qrCode;
                                            self.qrCodeInit();
                                        } else if (type == "faceverify") {
                                            self.faceVerifyInit();
                                        } else if (type == "otp") {
                                            self.otpSecret = r.data.otpSecret;
                                            if (self.otpSecret) {
                                                self.otpSend();
                                            }
                                        }
                                    } else {
                                        self.attestServerUrl = null;
                                        self.gid = null;

                                        self.securePhone = null;
                                        self.secureEmail = null;

                                        self.qrCode = null;

                                        self.otpSecret = null;
                                    }
                                },
                                error: function error(err) {
                                    self.attestServerUrl = null;
                                    self.gid = null;

                                    self.securePhone = null;
                                    self.secureEmail = null;

                                    self.qrCode = null;

                        startAppPushStatus: function startAppPushStatus() {
                            var self = this;

                            window.clearTimeout(self.appPushStatusTimeout); // 定时

                            /*
                             * status 
                             * 0 init 新建、初始化, 
                             * 1 sent 已发送、已扫码等, 
                             * 2 valid 验证通过, 
                             * 3 fail 验证失败, 
                             * 5 cancel 取消, 
                             * 9 expired 已过期、不存在
                             */
                            function appPushStatus() {
                                var url = self.attestServerUrl + '/api/guard/apppush/status';
                                var postdata = { "gid": self.gid };

                                $.ajax({
                                    type: "POST",
                                    url: url,
                                    contentType: 'application/json; charset=UTF-8',
                                    data: JSON.stringify(postdata),
                                    dataType: "json",
                                    timeout: 1000,
                                    success: function success(r) {
                                        // console.log(url, r);
                                        if (r && r.code == 0) {
                                            var status = r.data.status;

                                            if (status == 0) {

                                                self.appPushStatusShowAlert = false;
                                                self.appPushStatusAlertMessage = "";
                                            } else if (status == 1) {

                                                self.appPushStatusShowAlert = true;
                                                self.appPushStatusAlertMessage = "等待确认";
                                            } else if (status == 2) {

                                                self.appPushStatusShowAlert = true;
                                                self.appPushStatusAlertMessage = "已确认";

                                                window.clearTimeout(self.appPushStatusTimeout);
                                                window.setTimeout(function () {
                                                    self.submitForm();
                                                }, 500);
                                            } else if (status == 3) {

                                                self.appPushStatusShowAlert = true;
                                                self.appPushStatusAlertMessage = "确认失败";

                                                window.clearTimeout(self.appPushStatusTimeout);
                                            } else if (status == 5) {

                                                self.appPushStatusShowAlert = true;
                                                self.appPushStatusAlertMessage = "已取消";

                                                window.clearTimeout(self.appPushStatusTimeout);
                                            } else if (status == 9) {

                                                self.appPushStatusShowAlert = true;
                                                self.appPushStatusAlertMessage = "已失效，请重新发送";

                                                self.appPushCallbackCode = null;

                                                window.clearTimeout(self.appPushStatusTimeout);

                                                window.setTimeout(function () {
                                                    self.initGuard();
                                                }, 500);

                                            }

                                        } else {
                                            window.clearTimeout(self.appPushStatusTimeout);
                                        }
                                    },
                                    error: function error(err) {
                                        console.log(err);
                                        window.clearTimeout(self.appPushStatusTimeout);
                                    }
                                });

                                self.appPushStatusTimeout = window.setTimeout(appPushStatus, 2000);
                            }

                            self.appPushStatusTimeout = window.setTimeout(appPushStatus, 100);
                        },

                        qrCodeInit: function qrCodeInit() {

                            if (self.qrCode == null || self.qrCode.scanTypes == null || self.qrCode.scanTypes.length == 0) {
                                return;
                            }

                            var scanTypeNames = "";
                            for (var i = 0; i < self.qrCode.scanTypes.length; i++) {
                                var scanType = self.qrCode.scanTypes[i];
                                if (scanType == "superapp") {
                                    scanTypeNames += "、" + superappName;
                                } else if (scanType == "qq") {
                                    scanTypeNames += "、QQ";
                                } else if (scanType == "weixinmp") {
                                    scanTypeNames += "、微信";
                                } else if (scanType == "workweixinh5") {
                                    scanTypeNames += "、企业微信";
                                } else if (scanType == "dingtalkh5") {
                                    scanTypeNames += "、钉钉";
                                }
                            }
                            if (scanTypeNames != "") {
                                scanTypeNames = scanTypeNames.substring(1);
                            }

                            self.qrCodeScanTypeNames = scanTypeNames;

                            self.qrCodeSend();
                        },

                        startQrCodeStatus: function startQrCodeStatus() {
                            var self = this;

                            window.clearTimeout(self.appPushStatusTimeout); // 定时

                            /*
                             * status 
                             * 0 init 新建、初始化, 
                             * 1 sent 已发送、已扫码等, 
                             * 2 valid 验证通过, 
                             * 3 fail 验证失败, 
                             * 5 cancel 取消, 
                             * 8 scaned 已扫码
                             * 9 expired 已过期、不存在
                             */
                            function qrCodeStatus() {
                                var url = self.attestServerUrl + '/api/guard/qrcode/status';
                                var postdata = { "gid": self.gid };

                                $.ajax({
                                    type: "POST",
                                    url: url,
                                    contentType: 'application/json; charset=UTF-8',
                                    data: JSON.stringify(postdata),
                                    dataType: "json",
                                    timeout: 1000,
                                    success: function success(r) {
                                        // console.log(url, r);
                                        if (r && r.code == 0) {
                                            var status = r.data.status;

                                            if (status == 0) {

                                                self.qrCodeScanSuccess = false;
                                                self.qrCodeStatusShowAlert = false;
                                                self.qrCodeStatusAlertMessage = "";
                                            } else if (status == 1) {

                                                self.qrCodeScanSuccess = false;
                                                self.qrCodeStatusShowAlert = false;
                                                self.qrCodeStatusAlertMessage = "";
                                            } else if (status == 2) {

                                                self.qrCodeScanSuccess = true;
                                                self.qrCodeStatusShowAlert = true;
                                                self.qrCodeStatusAlertMessage = "已确认";

                                                window.clearTimeout(self.qrCodeStatusTimeout);
                                                window.setTimeout(function () {
                                                    self.submitForm();
                                                }, 500);
                                            } else if (status == 3) {

                                                self.qrCodeScanSuccess = false;
                                                self.qrCodeStatusShowAlert = true;
                                                self.qrCodeStatusAlertMessage = "确认失败";

                                                window.clearTimeout(self.qrCodeStatusTimeout);
                                            } else if (status == 5) {

                                                self.qrCodeScanSuccess = false;
                                                self.qrCodeStatusShowAlert = true;
                                                self.qrCodeStatusAlertMessage = "已拒绝";

                                                window.clearTimeout(self.qrCodeStatusTimeout);
                                            } else if (status == 8) {

                                                self.qrCodeScanSuccess = true;
                                                self.qrCodeStatusShowAlert = true;

                        faceVerifyInit: function faceVerifyInit() {
                            var self = this;

                        faceVerifySend: function faceVerifySend() {
                            var self = this;

                            var url = self.attestServerUrl + '/api/guard/faceverify/send';
                            var postdata = { "gid": self.gid };

                            $.ajax({
                                type: "POST",
                                url: url,
                                contentType: 'application/json; charset=UTF-8',
                                data: JSON.stringify(postdata),
                                dataType: "json",
                                success: function success(r) {
                                    console.log(url, r);

                                    if (r && r.code == 0 && r.data.scanFaceverify) {
                                        self.faceVerifyStatusShowAlert = false;
                                        self.faceVerifyStatusAlertMessage = "";

                                        self.faceVerifyScanFaceverify = r.data.scanFaceverify;
                                        self.faceVerifyCallbackCode = r.data.callbackCode;

                                        self.startFaceVerifyStatus();
                                    } else {

                                        self.startFaceVerifyStatus();
                                    }
                                },
                                error: function error(err) {
                                    console.log(err);
                                }
                            });
                        },

                        faceVerifyRefresh: function faceVerifyRefresh() {
                            var self = this;

                            self.clearFaceVerify();
                            self.initGuard();
                        },

                        startFaceVerifyStatus: function startFaceVerifyStatus() {
                            var self = this;

                            window.clearTimeout(self.appPushStatusTimeout); // 定时

                            /*
                             * status 
                             * 0 init 新建、初始化, 
                             * 1 sent 已发送、已扫码等, 
                             * 2 valid 验证通过, 
                             * 3 fail 验证失败, 
                             * 5 cancel 取消, 
                             * 8 scaned 已扫码
                             * 9 expired 已过期、不存在
                             */
                            function faceVerifyStatus() {
                                var url = self.attestServerUrl + '/api/guard/faceverify/status';
                                var postdata = { "gid": self.gid };

                                $.ajax({
                                    type: "POST",
                                    url: url,
                                    contentType: 'application/json; charset=UTF-8',
                                    data: JSON.stringify(postdata),
                                    dataType: "json",
                                    timeout: 1000,
                                    success: function success(r) {
                                        // console.log(url, r);
                                        if (r && r.code == 0) {
                                            var status = r.data.status;

                                            if (status == 0) {

                                                self.faceVerifyScanSuccess = false;
                                                self.faceVerifyStatusShowAlert = false;
                                                self.faceVerifyStatusAlertMessage = "";
                                            } else if (status == 1) {

                                                self.faceVerifyScanSuccess = false;
                                                self.faceVerifyStatusShowAlert = false;
                                                self.faceVerifyStatusAlertMessage = "";
                                            } else if (status == 2) {

                                                self.faceVerifyScanSuccess = true;
                                                self.faceVerifyStatusShowAlert = true;
                                                self.faceVerifyStatusAlertMessage = "人脸识别成功";

                                                window.clearTimeout(self.faceVerifyStatusTimeout);
                                                window.setTimeout(function () {
                                                    self.submitForm();
                                                }, 500);
                                            } else if (status == 3) {

                                                self.faceVerifyScanSuccess = false;
                                                self.faceVerifyStatusShowAlert = true;
                                                self.faceVerifyStatusAlertMessage = "人脸识别失败";

                                                window.clearTimeout(self.faceVerifyStatusTimeout);

                                            } else if (status == 11) {

                                                self.faceVerifyScanSuccess = true;
                                                self.faceVerifyStatusShowAlert = true;
                                                self.faceVerifyStatusAlertMessage = "人脸识别中…";
                                            } else if (status == 9) {

                                                self.faceVerifyScanSuccess = false;
                                                self.faceVerifyStatusShowAlert = true;
                                                self.faceVerifyStatusAlertMessage = "已失效，请刷新二维码";

                                                self.faceVerifyCallbackCode = null;

                                                window.clearTimeout(self.faceVerifyStatusTimeout);

                                                /* window.setTimeout(function () {
                                                  self.initGuard();
                                                }, 500); */

                                            }

                                        } else {
                                            window.clearTimeout(self.faceVerifyStatusTimeout);
                                        }
                                    },
                                    error: function error(err) {
                                        console.log(err);
                                        window.clearTimeout(self.faceVerifyStatusTimeout);
                                    }
                                });

                                self.faceVerifyStatusTimeout = window.setTimeout(faceVerifyStatus, 2000);
                            }

                            self.faceVerifyStatusTimeout = window.setTimeout(faceVerifyStatus, 100);
                        },

                        clearFaceVerify: function clearFaceVerify() {
                            var self = this;

                            window.clearTimeout(self.faceVerifyStatusTimeout);

                            self.faceVerifyScanQrcode = null;
                            self.faceVerifyScanSuccess = false;
                            self.faceVerifyStatusShowAlert = false;
                            self.faceVerifyStatusAlertMessage = "";

                            self.faceVerifyCallbackCode = null;
                        },


                    }
                });
            </script>
