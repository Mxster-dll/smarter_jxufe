name: smarter_jxufe
description: "智慧er江财 —— 江西财经大学校园服务客户端（SmarterJxUFE）"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+2

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # ⚠ 依赖纪律（2026-09-20 立 · 架构审查后清理）：**只保留真的被 import 的包**。
  # 本轮删掉 20 个零引用依赖（cached_network_image / cupertino_icons / cookie_jar /
  # connectivity_plus / dio_cookie_manager / device_info_plus / flutter_secure_storage /
  # flutter_image / flutter_dotenv / local_auth / http / hivez_flutter / provider /
  # permission_handler / qr_code_scanner / qr_flutter / date_type / get_storage /
  # sqflite / sqflite_common_ffi）—— 它们只在 pubspec 与 `pub get` 生成的
  # `GeneratedPluginRegistrant.*` 里出现，代码从未 import（`http` 的唯一「命中」是
  # `package:http_parser/…` 的子串误匹配）。守卫 = `test/repo_hygiene_test.dart`
  # 「依赖都被真的 import」：pubspec 的每个包必须在 lib/test/tool 里有
  # `package:<name>/` 命中，否则必须进那份**显式白名单**并写明理由。
  crypto: ^3.0.0
  dio: ^5.4.0
  encrypt: ^5.0.1
  fast_gbk: ^1.0.0
  html: ^0.15.0
  http_parser: ^4.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.2
  path: ^1.9.0
  image: ^4.0.15
  # 二维码**解码**（2026-10-09 四轮 · 手机端唤起微信支付要用）：校方二维码是服务端
  # 生成的 jpg，内容 = `weixin://wxpay/bizpayurl?pr=…`（微信 Native 支付的 code_url）。
  # 服务端**不暴露**这个链接（`checkOrder` 只回 orderno/paystate，另试 7 个可能的
  # JSON 路径全是 404），所以只能在本地把二维码解出来、再交给系统打开唤起微信。
  # 纯 Dart 实现、无平台配置；配对上面的 `image` 把 jpg 解成像素。
  zxing2: ^0.2.4
  url_launcher: ^6.2.0
  rxdart: ^0.28.0
  # 内嵌网页的**唯一实现**（2026-10-08 换 · AGENTS.md §40）：原先是 `webview_flutter`，
  # 而它**在 Windows 上没有平台实现**（`WebViewController()` 在桌面直接抛异常）→ 桌面只能
  # 降级到系统浏览器，而系统浏览器**拿不到 App 的登录态**（「打开智慧江财就是登录页」）。
  # `flutter_inappwebview` 自带 WebView2（Windows）实现，且**两端都有 CookieManager**
  # —— 「把 app 的统一认证登录态交给内嵌浏览器」正需要按 host 写 Cookie
  # （`webview_windows` **没有** Cookie API，只能靠 JS 塞 `document.cookie`，而跨域写不了）。
  # 迁移完成后 `webview_flutter` 已从本文件**删除**（全仓 `package:webview_flutter/` 的
  # import 命中为 0；`repo_hygiene_test` 的口径就是「只留真被 import 的包」）。
  # ⚠ Windows 上编译本插件要求 `nuget` 在 PATH 里（见 §40.3）。
  flutter_inappwebview: ^6.1.5
  collection: ^1.19.1
  freezed_annotation: 2.4.4
  # json_annotation 没有任何源码 import，但**必须保留**：freezed 生成的
  # `*.freezed.dart` 里写着 `@JsonSerializable()`，而注解层由
  # `freezed_annotation.dart` 转发 `export 'package:json_annotation/…'`；
  # 用 `part of` 的 `.g.dart` 不算 import，纯 import 统计必然漏判（白名单成员）。
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.5.1
  uuid: ^4.5.2
  flutter_local_notifications: ^22.0.1
  # 定时通知（zonedSchedule）要求 TZDateTime：本工程只用 tz.UTC 承载**绝对时刻**
  # （不依赖设备时区名，故不必引入 flutter_timezone）。它本来就是
  # flutter_local_notifications 的传递依赖，这里提升为直接依赖以便 import。
  timezone: ^0.11.1
  file_picker: ^11.0.3
  # 头像取图（相册 + 拍照）：file_picker 只能选已有文件、不能拍照，
  # 故头像两个入口统一走 image_picker（材料库仍用 file_picker，见 AGENTS.md §11.3）。
  image_picker: ^1.1.2
  pdfrx: ^2.2.24
  # 「填表助手」读写 .docx（用户 2026-10-07：上传学校下发的 docx → 自动识别待填项
  # → 自动填 → 手动调整 → 导出）。docx = 一个 zip（word/document.xml 等）：
  # archive 负责解包/重打包，xml 负责 document.xml 的结构化读写。
  # 两者本来就是 pdfrx 的传递依赖（pubspec.lock 里已在），此处只是提升为直接依赖。
  archive: ^4.0.9
  xml: ^6.6.1
dev_dependencies:
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.0
  riverpod_generator: ^2.4.0
  analyzer: ^6.4.1
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/rules/meta/rules_catalog.json
    - assets/rules/text/
    - assets/rules/pdf/
    - assets/images/campus_maps/
    # 四校区**矢量**底图（OSM 快照裁剪而成）。生成脚本与实测台账 = `tool/jxufe_map/`
    # （源 Overpass 快照 `_raw/` **不入库**：单个 0.5–1MB，且 `fetch_osm.py` 可重抓）。
    # 口径见 docs/agents/41-校区矢量地图.md，守卫 = test/campus_map_test.dart。
    - assets/campus_map/
    # 开屏主视觉 = `library_shine.png`（蛟桥图书馆插画的透明底裁切，
    # 源图 `design/蛟桥图书馆图片/svg导出_透明底_裁切.png`），
    # 由 lib/features/splash/presentation/splash_flow_light_stage.dart 加载并叠流动光效。
    # 同目录下几个 SVG + geometry.json 是早前那版「线条稿逐层生长」开屏的实测几何
    # （生成脚本 .scratch/splash_art/make_splash_svg.py）——**那版已撤**，
    # 这几个文件留着供 Web / 设计稿 / 其他端直接引用，别当它们在 Flutter 侧还有调用方。
    - assets/images/splash/
    # 品牌图形（主页顶栏品牌位）：`logos/new/logo.png` 的**紧构图**（楼体占 80% 宽，
    # 圆角不烘死在资源里，由 UI 的 ClipRRect 负责），生成脚本
    # `logos/new/icon-from-png/make_icons.py`（与桌面图标同一枚源图，取景不同）。
    - assets/images/brand/
    # 标题栏侧栏开关的自绘图标（源文件在 design/icons/，Inkscape 导出；见该目录 README）
    - assets/images/icons/
    # ⚠ 必须**逐个列文件**，绝不能写成目录 `assets/capture_certs/`（2026-10-10 立）。
    # 目录写法会把同目录下的 `*.key` 一起打进 APK / Windows 安装包：`.gitignore` 只挡得住
    # 「入库」，**挡不住打包**。实测 v1.0.0 / v2.0.0 两个 APK 里
    # `assets/flutter_assets/assets/capture_certs/leaf.key` 与本地私钥逐字节相同。
    # 这三个都是**公开证书**，可正常分发：
    #   ca.cer  → 装进系统 Root（`CaInstaller` 用，`guid_capture_session.dart`）
    #   ca.crt / ca.crt+leaf.crt → 给本机 MITM 代理作证书链（`_buildServerContext()`）
    # ⚠ 例外与已知边界：**`leaf.key` 目前仍必须随包分发** —— `_buildServerContext()` 要
    # `ctx.usePrivateKeyBytes(...)`，dart:io 要求私钥与证书匹配，去掉它「平台标识」抓包直接不可用。
    # 也就是说这个自签服务端私钥**仍然在安装包里**（有意的既有取舍，不是遗漏）。
    # 正解 = 首次使用时在设备上现场生成 leaf 密钥对并自签（需 pointycastle 做 PKCS#8→PEM）；
    # 在那之前，别把这里的「只列证书」误解成「包里没有私钥」。
    # 未列出的 `ca.key` = 死文件（全仓零引用：CA 证书已自签、`ca.cer` 本身即自签名证书）→ 不再随包分发。
    - assets/capture_certs/ca.cer
    - assets/capture_certs/ca.crt
    - assets/capture_certs/leaf.crt
    # 通识课程库（毕业学分页「这门通识课属于哪个模块」的唯一口径）。
    # 源 xlsx 不入库，由 `tool/make_ge_catalog.py` 转成本 JSON 后入库 ——
    # 学校改版时重跑那个脚本即可，守卫见 test/general_education_catalog_test.dart。
    - assets/general_education/ge_catalog.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: Cascadia Code
      fonts:
        - asset: assets/fonts/CascadiaCode-Regular.ttf
    - family: 霞鹜文楷
      fonts:
        - asset: assets/fonts/LXGWWenKai-Medium.ttf
    - family: 霞鹜臻楷
      fonts:
        - asset: assets/fonts/霞鹜臻楷.ttf
    - family: 仓耳今楷01
      fonts:
        - asset: assets/fonts/仓耳今楷01 W03.ttf
    - family: SmarterJxufeIcons
      fonts:
        - asset: assets/smarter_jxufe_icons.ttf
    # 窗口标题栏三键的图标（2026-10-09 立 · 见 docs/agents §43.4）。
    # 来源 = VS Code 的 @vscode/codicons（MIT），**只子集出标题栏要的四个字形**
    # （chrome-minimize \eaba / chrome-maximize \eab9 / chrome-restore \eabb /
    # chrome-close \eab8），原本 147 KB → **1.2 KB**。子集命令（在 vshell 那份
    # codicon.ttf 上跑，本仓不留原字体）：
    #   python -m fontTools.subset codicon.ttf --unicodes=EAB8,EAB9,EABA,EABB \
    #     --no-hinting --desubroutinize --glyph-names \
    #     --output-file=assets/fonts/codicon-titlebar.ttf
    # ⚠ 用户 2026-10-09 指定「三键 icon 要跟 native/vshell 一致」，所以用这套字形，
    # 不要退回自己拿 CustomPaint 画的近似线框。
    - family: codicon
      fonts:
        - asset: assets/fonts/codicon-titlebar.ttf
