    <!-- 塔楼与裙楼交界台口 -->
    <g id="ledge" fill="#FFFFFF" fill-opacity="0.16">
      <path d="M681 864h624v12h-624Z"/>
    </g>
  </g>
  <!-- 红瓦屋顶（实测轮廓） -->
  <g id="roof" fill="#C3282E">
