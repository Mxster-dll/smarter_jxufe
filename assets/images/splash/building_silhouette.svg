    </g>
    <!-- 塔楼窗阵（4 列 × 7 排，可逐格 scale-in） -->
    <g id="windows-tower" fill="#7FA8C9" fill-opacity="0.88">
      <path d="M714 411h90v84h-90ZM714 501h90v84h-90ZM714 522h90v39h-90ZM714 579h90v39h-90ZM714 636h90v39h-90ZM714 693h90v39h-90ZM870 411h90v84h-90ZM870 501h90v84h-90ZM870 522h90v39h-90ZM870 579h90v39h-90ZM870 636h90v39h-90ZM870 693h90v39h-90ZM1026 411h90v84h-90ZM1026 501h90v84h-90ZM1026 522h90v39h-90ZM1026 579h90v39h-90ZM1026 636h90v39h-90ZM1026 693h90v39h-90ZM1182 411h90v84h-90ZM1182 501h90v84h-90ZM1182 522h90v39h-90ZM1182 579h90v39h-90ZM1182 636h90v39h-90ZM1182 693h90v39h-90Z"/>
    </g>
