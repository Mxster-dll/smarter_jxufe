org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# ⚠️ 关闭 Kotlin 增量编译（2026-09-11 事故驱动）：pub 缓存在 C: 盘、工程在 D: 盘，
# Kotlin 守护进程反复报 "Could not close incremental caches ... different roots"
# → 增量产物不可信，曾导致安装包 dex 缺失 widget 类
# （NoClassDefFoundError: WidgetRefreshJobService → App 每次启动即崩）。
# 代价是多花几十秒重编 Kotlin，换取产物确定性。
kotlin.incremental=false
